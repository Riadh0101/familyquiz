services:
  quiz:
    build: .
    image: family-quiz:latest
    container_name: family-quiz
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - quiz_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_PATH=/app/data/quiz.db

volumes:
  quiz_data:
