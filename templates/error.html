{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow text-center">
            <div class="card-body p-5">
                <i class="bi bi-emoji-frown display-3 text-primary d-block mb-3"></i>
                <h1 class="h3">Error {{ code }}</h1>
                <p class="text-muted">{{ message }}</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-2">
                    <i class="bi bi-house me-1"></i>Back to the quiz
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
