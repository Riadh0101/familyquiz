{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row login-container align-items-center justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card login-card shadow-lg animate-in">
            <div class="card-header text-white text-center border-0">
                <i class="bi bi-house-heart-fill" style="font-size: 3rem;"></i>
                <h3 class="mt-2 mb-0">Welcome to Family Quiz</h3>
                <p class="mb-0 mt-2 opacity-75 small">Sign in to start the fun!</p>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">
                            <i class="bi bi-person me-1"></i>Username
                        </label>
                        <input type="text" class="form-control" name="username" id="username"
                               placeholder="Enter your username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">
                            <i class="bi bi-lock me-1"></i>Password
                        </label>
                        <input type="password" class="form-control" name="password" id="password"
                               placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <div class="alert alert-info py-2 px-3 mb-0 small">
                        <i class="bi bi-info-circle me-1"></i>
                        New users are auto-registered on first login.<br>
                        Your password is your <strong>username</strong> + <strong>123</strong>
                    </div>
                    <div class="mt-2">
                        <small class="text-muted">
                            <i class="bi bi-shield-lock me-1"></i>Admin: admin / admin123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
